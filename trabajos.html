<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01//EN" "http://www.w3.org/TR/html4/strict.dtd">
<html>
	<head>
		<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
		<title>Trabajos de Ana Jimeno Demuth</title>
		<link rel=stylesheet type=text/css href="css/trabajos.css">
		<script src="lib/jquery/jquery-1.3.2.js" type="text/javascript"></script>
		<script type="text/javascript">
			function getVar(){
                var tr =  document.location.search;
				if(tr.indexOf('tr=')!=-1)
				  tr = tr.substr(4, tr.length);
				if (!tr)
				  tr = "di_ascima";
				return tr;
         	}
			function contentDisp() {
				$.ajax({
					url: 'images/'+tr+'/texto.txt' 
				})
			}
			$(document).ready(function(){
				
				var top = $('#atras').offset().top - parseFloat($('#atras').css('margin-top').replace(/auto/,0)) ;
				$(window).scroll(function(){
					var y = $(window).scrollTop();
					if(y>= top ) {
						$('#atras').addClass('fixed');
					} else {
						$('#atras').removeClass('fixed');
					}
				});
			});
		</script>
	</head>
	<body>
		<script type="text/javascript">
			$(document).ready(function(){
				$("#texto").load("images/"+tr+"/texto.txt");
			})
		</script>
		
		<div id="columna" align=center>
			<div id="AtrasWraper">
				<div id="atras"><a href="javascript: history.go(-1);">Atrás</a></div>
			</div>
			<div>
			<script type="text/javascript">
				tr = getVar();
				trab = tr.substr(3, tr.length);
				document.write('<img src="images/'+tr+'/'+trab+'_g/'+trab+'_g01.jpg">');
			</script>
			</div>
			<div id="texto"></div>
		</div>
	</body>
</html>
